[package]
name = "dexsql-cli"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "dexsql"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "=4.6.1", features = ["derive", "std", "color", "help", "usage", "error-context", "suggestions"] }
dexsql = { path = "../dexsql" }
dexsql-core = { path = "../dexsql-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
apk-info-axml = "1.0.13"
codepage-437 = "0.1.0"
