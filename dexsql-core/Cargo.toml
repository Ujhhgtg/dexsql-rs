[package]
name = "dexsql-core"
version.workspace = true
edition.workspace = true
publish = false
description = "DEX loading, SQL planning, and execution internals for dexsql"

[dependencies]
memmap2 = "0.9.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
sha2 = "0.10.9"
crc32fast = "1.5.2"
serde_json = "1"
memchr = "2"
sqlparser = "0.63"
